<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <meta name="color-scheme" content="light dark">
    <title>Feelings Wheel Tracker</title>
    <style>
        :root {
            --bg-color: #ffffff;
            --text-color: #333;
            --card-bg: #ffffff;
            --section-bg: #f8f8f8;
            --border-color: #e0e0e0;
            --shadow: rgba(0,0,0,0.1);
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg-color: #1a1a1a;
                --text-color: #e0e0e0;
                --card-bg: #2a2a2a;
                --section-bg: #242424;
                --border-color: #404040;
                --shadow: rgba(0,0,0,0.3);
            }
        }

        body.dark-mode {
            --bg-color: #1a1a1a;
            --text-color: #e0e0e0;
            --card-bg: #2a2a2a;
            --section-bg: #242424;
            --border-color: #404040;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: var(--bg-color);
            color: var(--text-color);
            transition: background 0.3s, color 0.3s;
            overflow-x: hidden;
        }

        .dark-mode-toggle {
            position: fixed; top: 20px; right: 20px;
            background: var(--card-bg); color: var(--text-color); border: 1px solid var(--border-color);
            width: 44px; height: 44px; border-radius: 50%;
            cursor: pointer; display: flex; align-items: center; justify-content: center;
            z-index: 1000; box-shadow: 0 4px 12px var(--shadow);
        }

        .container { max-width: 1000px; margin: 0 auto; padding: 20px; }
        h1 { text-align: center; margin-top: 20px; font-weight: normal; font-size: 28px; }
        .subtitle { text-align: center; opacity: 0.7; margin-bottom: 20px; font-size: 14px; }

        .wheel-section {
            display: flex; flex-direction: column; align-items: center;
            padding: 10px 0 40px 0;
            min-height: 70vh; overflow: hidden;
        }

        .wheel-container {
            width: 95vw;
            max-width: 850px;
            aspect-ratio: 1 / 1;
            position: relative;
            margin: 0 auto;
            touch-action: none;
        }

        #wheelCanvas {
            width: 100%; height: 100%;
            display: block; cursor: grab;
            will-change: transform;
            transform-origin: center center;
            -webkit-tap-highlight-color: transparent;
            touch-action: none;
        }
        #wheelCanvas:active { cursor: grabbing; }

        .stats-section {
            background: var(--section-bg); padding: 40px 20px;
            border-top: 1px solid var(--border-color);
        }

        .chart-wrapper {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            margin: 0 auto 40px;
        }

        .chart-scroll-container {
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            padding-bottom: 10px;
        }

        .chart-scroll-container canvas { min-width: 600px; height: 320px; }

        .legend-container {
            display: flex; flex-wrap: wrap; justify-content: center;
            gap: 15px; margin-top: 15px; font-size: 12px;
        }
        .legend-item { display: flex; align-items: center; gap: 5px; }
        .legend-color { width: 12px; height: 12px; border-radius: 2px; }

        .logs-container {
            max-height: 400px; overflow-y: auto; background: var(--card-bg);
            border: 1px solid var(--border-color); border-radius: 12px;
            margin-bottom: 20px;
        }
        .log-entry {
            padding: 16px; border-bottom: 1px solid var(--border-color);
            display: flex; justify-content: space-between; align-items: center;
        }

        .about-section {
            margin-top: 60px; padding-top: 40px;
            border-top: 1px solid var(--border-color);
            line-height: 1.6;
        }

        .button-group {
            display: flex; flex-wrap: wrap; justify-content: center; gap: 10px;
            margin-top: 20px;
        }
        .action-btn {
            background: var(--card-bg); border: 1px solid var(--border-color);
            color: var(--text-color); padding: 12px 24px; cursor: pointer;
            border-radius: 8px; font-size: 14px;
        }
        .btn-danger { color: #e74c3c; }

        .date-display { text-align: center; margin-bottom: 20px; font-size: 16px; font-weight: bold; }
    </style>
</head>
<body>
    <button class="dark-mode-toggle" onclick="toggleDarkMode()">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
    </button>

    <div class="wheel-section">
        <h1>Feelings Wheel</h1>
        <p class="subtitle">Rotate to read. Tap an emotion to log it.</p>
        <div class="wheel-container">
            <canvas id="wheelCanvas"></canvas>
        </div>
    </div>

    <div class="stats-section">
        <div class="container">
            <div class="date-display" id="todayDate"></div>
            <div class="chart-wrapper"><div class="chart-scroll-container"><canvas id="barChart"></canvas></div></div>
            <div class="chart-wrapper">
                <div class="chart-scroll-container"><canvas id="lineChart"></canvas></div>
                <div class="legend-container" id="timelineLegend"></div>
            </div>
            <div class="logs-container" id="logsContainer"></div>
            <div class="button-group">
                <button class="action-btn" onclick="downloadData('day')">Download Today</button>
                <button class="action-btn" onclick="downloadData('all')">Download All</button>
                <button class="action-btn btn-danger" onclick="clearTodayLogs()">Clear Today</button>
            </div>
            <div class="about-section">
                <h2>About</h2>
                <p>Rotate the wheel freely to align emotions to the right for easy reading. Pinch to zoom on mobile. The wheel stops immediately when you release. All data is saved locally on your device.</p>
            </div>
        </div>
    </div>

    <script>
        // Higher resolution canvas for sharper display
        const CANVAS_SIZE = 8000;
        const CX = CANVAS_SIZE / 2, CY = CANVAS_SIZE / 2;
        const SCALE = CANVAS_SIZE / 5000; // Scale factor from original 5000px design

        // GEOMETRY (scaled up)
        const R0 = 336 * SCALE;   // Center hole
        const R1 = 756 * SCALE;   // Core Layer Boundary
        const R2 = 1540 * SCALE;  // Middle Layer Boundary
        const R3 = 2180 * SCALE;  // Outer Layer Boundary
        const HIT_MARGIN = 400 * SCALE;

        const wheelData = {
            "Happy": { color: "#F9E79F", middleColor: "#FEF5D4", outerColor: "#F9E79F", darkColor: "#8B7355", darkMiddleColor: "#6B5D4F", darkOuterColor: "#5B4D3F", middleLayer: ["Content", "Playful", "Excited", "Interested", "Proud", "Accepted", "Powerful", "Peaceful", "Trusting", "Optimistic"], outerLayer: ["Joyful", "Free", "Cheeky", "Aroused", "Curious", "Inquisitive", "Successful", "Confident", "Respected", "Valued", "Courageous", "Creative", "Loving", "Thankful", "Sensitive", "Intimate", "Hopeful", "Inspired"] },
            "Sad": { color: "#A9CCE3", middleColor: "#D6EAF8", outerColor: "#A9CCE3", darkColor: "#4A6B7C", darkMiddleColor: "#3A5B6C", darkOuterColor: "#2A4B5C", middleLayer: ["Lonely", "Vulnerable", "Despair", "Guilty", "Depressed", "Hurt"], outerLayer: ["Isolated", "Abandoned", "Victimized", "Fragile", "Grief", "Powerless", "Ashamed", "Remorseful", "Empty", "Inferior", "Embarrassed", "Hesitant", "Humiliated", "Horrible"] },
            "Disgusted": { color: "#B8B8B8", middleColor: "#D9D9D9", outerColor: "#B8B8B8", darkColor: "#5A5A5A", darkMiddleColor: "#4A4A4A", darkOuterColor: "#3A3A3A", middleLayer: ["Disapproving", "Disappointed", "Awful", "Repelled"], outerLayer: ["Judgmental", "Embarrassed", "Appalled", "Revolted", "Nauseated", "Detestable", "Horrified", "Hesitant"] },
            "Angry": { color: "#F5B7B1", middleColor: "#FADBD8", outerColor: "#F5B7B1", darkColor: "#8B5A56", darkMiddleColor: "#7B4A46", darkOuterColor: "#6B3A36", middleLayer: ["Mad", "Aggressive", "Frustrated", "Distant", "Critical"], outerLayer: ["Furious", "Jealous", "Provoked", "Hostile", "Infuriated", "Annoyed", "Withdrawn", "Numb", "Skeptical", "Dismissive", "Let down", "Humiliated", "Bitter", "Violated", "Indignant", "Ridiculed", "Disrespected", "Resentful", "Betrayed"] },
            "Fearful": { color: "#FAD7A0", middleColor: "#FDEBD0", outerColor: "#FAD7A0", darkColor: "#8B6F50", darkMiddleColor: "#7B5F40", darkOuterColor: "#6B4F30", middleLayer: ["Scared", "Anxious", "Insecure", "Weak", "Rejected", "Threatened"], outerLayer: ["Helpless", "Frightened", "Overwhelmed", "Worried", "Inadequate", "Inferior", "Worthless", "Insignificant", "Excluded", "Persecuted", "Nervous", "Exposed"] },
            "Bad": { color: "#A9DFBF", middleColor: "#D5F4E6", outerColor: "#A9DFBF", darkColor: "#4A6F5F", darkMiddleColor: "#3A5F4F", darkOuterColor: "#2A4F3F", middleLayer: ["Bored", "Busy", "Stressed", "Tired"], outerLayer: ["Indifferent", "Apathetic", "Pressured", "Rushed", "Overwhelmed", "Out of control", "Sleepy", "Unfocused"] },
            "Surprised": { color: "#D7BDE2", middleColor: "#E8DAEF", outerColor: "#D7BDE2", darkColor: "#6B5D71", darkMiddleColor: "#5B4D61", darkOuterColor: "#4B3D51", middleLayer: ["Startled", "Confused", "Amazed", "Excited"], outerLayer: ["Shocked", "Dismayed", "Perplexed", "Astonished", "Awe", "Eager", "Energetic", "Disillusioned"] }
        };

        let emotionLogs = JSON.parse(localStorage.getItem('emotionLogs')) || [];
        let wheelRotation = 0, isDragging = false, dragStartAngle = 0, rotationAtStart = 0;

        // Pinch zoom state
        let currentScale = 1;
        let initialPinchDistance = 0;
        let scaleAtPinchStart = 1;
        let isPinching = false;

        const canvas = document.getElementById('wheelCanvas');
        const ctx = canvas.getContext('2d');

        function init() {
            // Set canvas size for high DPI displays
            canvas.width = CANVAS_SIZE;
            canvas.height = CANVAS_SIZE;

            document.getElementById('todayDate').textContent = "Activity for " + new Date().toLocaleDateString();
            checkSystemDarkMode();
            drawWheel();
            updateStats();
            setupEvents();
        }

        function drawWheel() {
            const isDark = document.body.classList.contains('dark-mode');
            ctx.clearRect(0, 0, CANVAS_SIZE, CANVAS_SIZE);
            let startAngle = 0;
            const total = getTotalWeights();

            Object.entries(wheelData).forEach(([cat, data]) => {
                const span = (getCatWeight(data) / total) * (Math.PI * 2);
                const endAngle = startAngle + span;

                drawSeg(R0, R1, startAngle, endAngle, isDark ? data.darkColor : data.color);
                drawText(startAngle + span/2, (R0+R1)/2, cat, 84 * SCALE, isDark);

                const mStep = span / data.middleLayer.length;
                data.middleLayer.forEach((t, i) => {
                    const a = startAngle + i * mStep;
                    drawSeg(R1, R2, a, a + mStep, isDark ? data.darkMiddleColor : data.middleColor);
                    drawText(a + mStep/2, (R1+R2)/2, t, 72 * SCALE, isDark);
                });

                const oStep = span / data.outerLayer.length;
                data.outerLayer.forEach((t, i) => {
                    const a = startAngle + i * oStep;
                    drawSeg(R2, R3, a, a + oStep, isDark ? data.darkOuterColor : data.outerColor);
                    drawText(a + oStep/2, (R2+R3)/2, t, 68 * SCALE, isDark);
                });
                startAngle = endAngle;
            });
        }

        function drawSeg(r1, r2, s, e, c) {
            ctx.beginPath();
            ctx.arc(CX, CY, r2, s, e);
            ctx.arc(CX, CY, r1, e, s, true);
            ctx.fillStyle = c;
            ctx.fill();
            ctx.strokeStyle = 'white';
            ctx.lineWidth = 8 * SCALE;
            ctx.stroke();
        }

        function drawText(a, r, t, size, isDark) {
            ctx.save();
            ctx.translate(CX + Math.cos(a)*r, CY + Math.sin(a)*r);
            ctx.rotate(a);
            ctx.fillStyle = isDark ? '#fff' : '#000';
            ctx.font = `600 ${size}px sans-serif`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(t, 0, 0);
            ctx.restore();
        }

        // Normalize angle to [0, 2*PI) range - handles any input value correctly
        function normalizeAngle(angle) {
            const twoPi = Math.PI * 2;
            let normalized = angle % twoPi;
            if (normalized < 0) normalized += twoPi;
            return normalized;
        }

        function setupEvents() {
            const getPos = e => {
                const r = canvas.getBoundingClientRect();
                const t = e.touches ? e.touches[0] : e;
                return {
                    x: t.clientX - r.left,
                    y: t.clientY - r.top,
                    scale: CANVAS_SIZE / r.width
                };
            };

            const getPinchDistance = (touches) => {
                const dx = touches[0].clientX - touches[1].clientX;
                const dy = touches[0].clientY - touches[1].clientY;
                return Math.sqrt(dx * dx + dy * dy);
            };

            const start = e => {
                if (e.touches && e.touches.length === 2) {
                    // Start pinch zoom
                    isPinching = true;
                    isDragging = false;
                    initialPinchDistance = getPinchDistance(e.touches);
                    scaleAtPinchStart = currentScale;
                    return;
                }

                if (e.touches && e.touches.length !== 1) return;

                const p = getPos(e);
                const dx = p.x * p.scale - CX, dy = p.y * p.scale - CY;
                const d = Math.sqrt(dx*dx + dy*dy);
                if (d < R3 + HIT_MARGIN) {
                    isDragging = true;
                    dragStartAngle = Math.atan2(dy, dx);
                    rotationAtStart = wheelRotation;
                }
            };

            const move = e => {
                if (e.touches && e.touches.length === 2 && isPinching) {
                    // Handle pinch zoom
                    e.preventDefault();
                    const newDistance = getPinchDistance(e.touches);
                    const scaleDelta = newDistance / initialPinchDistance;
                    currentScale = Math.min(Math.max(scaleAtPinchStart * scaleDelta, 0.5), 4);
                    updateCanvasTransform();
                    return;
                }

                if (!isDragging) return;
                if (e.touches && e.touches.length !== 1) return;

                const p = getPos(e);
                const currentAngle = Math.atan2(p.y * p.scale - CY, p.x * p.scale - CX);
                wheelRotation = rotationAtStart + (currentAngle - dragStartAngle);
                updateCanvasTransform();
            };

            const end = e => {
                if (isPinching) {
                    isPinching = false;
                    // If there's still one touch, could start rotation
                    if (e.touches && e.touches.length === 1) {
                        const p = getPos(e);
                        const dx = p.x * p.scale - CX, dy = p.y * p.scale - CY;
                        isDragging = true;
                        dragStartAngle = Math.atan2(dy, dx);
                        rotationAtStart = wheelRotation;
                    }
                    return;
                }

                if (!isDragging) return;
                isDragging = false;

                if (Math.abs(wheelRotation - rotationAtStart) < 0.05) {
                    const p = e.changedTouches ? getPos(e.changedTouches[0]) : getPos(e);
                    handleClick(p.x * p.scale, p.y * p.scale);
                }
            };

            function updateCanvasTransform() {
                canvas.style.transform = `scale(${currentScale}) rotate(${wheelRotation}rad)`;
            }

            canvas.addEventListener('mousedown', start);
            window.addEventListener('mousemove', move);
            window.addEventListener('mouseup', end);

            canvas.addEventListener('touchstart', e => {
                e.preventDefault();
                start(e);
            }, {passive: false});

            canvas.addEventListener('touchmove', e => {
                e.preventDefault();
                move(e);
            }, {passive: false});

            canvas.addEventListener('touchend', end);
            canvas.addEventListener('touchcancel', end);

            // Mouse wheel zoom for desktop
            canvas.addEventListener('wheel', e => {
                e.preventDefault();
                const zoomFactor = e.deltaY > 0 ? 0.9 : 1.1;
                currentScale = Math.min(Math.max(currentScale * zoomFactor, 0.5), 4);
                canvas.style.transform = `scale(${currentScale}) rotate(${wheelRotation}rad)`;
            }, {passive: false});
        }

        function handleClick(x, y) {
            const dx = x - CX, dy = y - CY;
            const dist = Math.sqrt(dx*dx + dy*dy);
            if (dist < R0 || dist > R3) return;

            // Get the raw click angle in canvas coordinates
            const rawClickAngle = Math.atan2(dy, dx);

            // Normalize the wheel rotation to avoid precision issues with large values
            const normalizedRotation = normalizeAngle(wheelRotation);

            // Calculate the data angle (which segment in the wheel data)
            // We subtract rotation because the canvas is visually rotated
            let dataAngle = normalizeAngle(rawClickAngle - normalizedRotation);

            const total = getTotalWeights();
            let currentAngle = 0;

            for (const [cat, data] of Object.entries(wheelData)) {
                const catSpan = (getCatWeight(data) / total) * (Math.PI * 2);
                const catEndAngle = currentAngle + catSpan;

                if (dataAngle >= currentAngle && dataAngle < catEndAngle) {
                    const localAngle = dataAngle - currentAngle;
                    let emotion, layer, segmentIndex;

                    if (dist < R1) {
                        // Core layer - the whole category
                        emotion = cat;
                        layer = 'core';
                        segmentIndex = 0;
                    } else if (dist < R2) {
                        // Middle layer
                        const segmentSize = catSpan / data.middleLayer.length;
                        segmentIndex = Math.floor(localAngle / segmentSize);
                        // Clamp to valid range
                        segmentIndex = Math.max(0, Math.min(segmentIndex, data.middleLayer.length - 1));
                        emotion = data.middleLayer[segmentIndex];
                        layer = 'middle';
                    } else {
                        // Outer layer
                        const segmentSize = catSpan / data.outerLayer.length;
                        segmentIndex = Math.floor(localAngle / segmentSize);
                        // Clamp to valid range
                        segmentIndex = Math.max(0, Math.min(segmentIndex, data.outerLayer.length - 1));
                        emotion = data.outerLayer[segmentIndex];
                        layer = 'outer';
                    }

                    if (emotion) {
                        log(emotion, cat);
                        highlight(cat, layer, segmentIndex, currentAngle, catSpan);
                    }
                    return;
                }
                currentAngle = catEndAngle;
            }
        }

        function highlight(cat, layer, segmentIndex, catStartAngle, catSpan) {
            const data = wheelData[cat];
            let r1, r2, startAngle, endAngle;

            if (layer === 'core') {
                r1 = R0;
                r2 = R1;
                startAngle = catStartAngle;
                endAngle = catStartAngle + catSpan;
            } else if (layer === 'middle') {
                r1 = R1;
                r2 = R2;
                const step = catSpan / data.middleLayer.length;
                startAngle = catStartAngle + segmentIndex * step;
                endAngle = startAngle + step;
            } else {
                r1 = R2;
                r2 = R3;
                const step = catSpan / data.outerLayer.length;
                startAngle = catStartAngle + segmentIndex * step;
                endAngle = startAngle + step;
            }

            ctx.save();
            ctx.beginPath();
            ctx.arc(CX, CY, r2, startAngle, endAngle);
            ctx.arc(CX, CY, r1, endAngle, startAngle, true);
            ctx.closePath();
            ctx.fillStyle = 'rgba(255,255,255,0.8)';
            ctx.fill();
            ctx.restore();

            setTimeout(drawWheel, 150);
        }

        function log(emotion, category) {
            const now = new Date();
            emotionLogs.unshift({
                id: Date.now(),
                emotion,
                category,
                date: now.toISOString().split('T')[0],
                time: now.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}),
                timestamp: now.getTime()
            });
            localStorage.setItem('emotionLogs', JSON.stringify(emotionLogs));
            updateStats();
        }

        function updateStats() {
            const today = new Date().toISOString().split('T')[0];
            const logs = emotionLogs.filter(l => l.date === today);
            document.getElementById('logsContainer').innerHTML = logs.map(l => `
                <div class="log-entry">
                    <span><strong>${l.emotion}</strong> <small>(${l.category})</small></span>
                    <span>${l.time} <button style="border:none; background:none; cursor:pointer;" onclick="deleteLog(${l.id})">×</button></span>
                </div>`).join('') || '<div style="padding:20px; text-align:center; opacity:0.5">No logs today</div>';
            drawBarChart(logs);
            drawLineChart(logs);
            drawLegend();
        }

        function drawBarChart(logs) {
            const cvs = document.getElementById('barChart');
            const chartCtx = cvs.getContext('2d');
            const dpr = window.devicePixelRatio || 1;
            const r = cvs.getBoundingClientRect();

            cvs.width = r.width * dpr;
            cvs.height = r.height * dpr;
            chartCtx.scale(dpr, dpr);

            const w = r.width, h = r.height;
            const padLeft = 50, padRight = 20, padTop = 30, padBottom = 50;
            const isDark = document.body.classList.contains('dark-mode');

            chartCtx.clearRect(0, 0, w, h);
            chartCtx.font = '12px -apple-system, BlinkMacSystemFont, sans-serif';

            if (!logs.length) {
                chartCtx.fillStyle = isDark ? '#666' : '#999';
                chartCtx.textAlign = 'center';
                chartCtx.fillText('No data for today', w/2, h/2);
                return;
            }

            const counts = {};
            logs.forEach(l => counts[l.category] = (counts[l.category]||0)+1);
            const cats = Object.keys(counts);
            const max = Math.max(...Object.values(counts));

            // Draw axes
            chartCtx.strokeStyle = isDark ? '#444' : '#ccc';
            chartCtx.lineWidth = 1;
            chartCtx.beginPath();
            chartCtx.moveTo(padLeft, padTop);
            chartCtx.lineTo(padLeft, h - padBottom);
            chartCtx.lineTo(w - padRight, h - padBottom);
            chartCtx.stroke();

            // Y-axis labels
            chartCtx.fillStyle = isDark ? '#aaa' : '#666';
            chartCtx.textAlign = 'right';
            chartCtx.textBaseline = 'middle';
            const ySteps = Math.min(max, 5);
            for (let i = 0; i <= ySteps; i++) {
                const val = Math.round((max / ySteps) * i);
                const y = h - padBottom - (i / ySteps) * (h - padTop - padBottom);
                chartCtx.fillText(val.toString(), padLeft - 8, y);

                // Grid line
                chartCtx.strokeStyle = isDark ? '#333' : '#eee';
                chartCtx.beginPath();
                chartCtx.moveTo(padLeft, y);
                chartCtx.lineTo(w - padRight, y);
                chartCtx.stroke();
            }

            // Draw bars
            const barAreaWidth = w - padLeft - padRight;
            const barWidth = Math.min(60, barAreaWidth / cats.length - 20);
            const barGap = (barAreaWidth - barWidth * cats.length) / (cats.length + 1);

            cats.forEach((cat, i) => {
                const val = counts[cat];
                const barHeight = (val / max) * (h - padTop - padBottom);
                const x = padLeft + barGap + i * (barWidth + barGap);
                const y = h - padBottom - barHeight;

                chartCtx.fillStyle = isDark ? wheelData[cat].darkColor : wheelData[cat].color;
                chartCtx.fillRect(x, y, barWidth, barHeight);

                // Value on top
                chartCtx.fillStyle = isDark ? '#fff' : '#333';
                chartCtx.textAlign = 'center';
                chartCtx.textBaseline = 'bottom';
                chartCtx.fillText(val.toString(), x + barWidth/2, y - 5);

                // Category label
                chartCtx.textBaseline = 'top';
                chartCtx.save();
                chartCtx.translate(x + barWidth/2, h - padBottom + 8);
                if (cats.length > 5) chartCtx.rotate(0.3);
                chartCtx.fillText(cat, 0, 0);
                chartCtx.restore();
            });
        }

        function drawLineChart(logs) {
            const cvs = document.getElementById('lineChart');
            const chartCtx = cvs.getContext('2d');
            const dpr = window.devicePixelRatio || 1;
            const r = cvs.getBoundingClientRect();

            cvs.width = r.width * dpr;
            cvs.height = r.height * dpr;
            chartCtx.scale(dpr, dpr);

            const w = r.width, h = r.height;
            const padLeft = 50, padRight = 20, padTop = 20, padBottom = 40;
            const isDark = document.body.classList.contains('dark-mode');

            chartCtx.clearRect(0, 0, w, h);
            chartCtx.font = '12px -apple-system, BlinkMacSystemFont, sans-serif';

            // Draw axes
            chartCtx.strokeStyle = isDark ? '#444' : '#ccc';
            chartCtx.lineWidth = 1;
            chartCtx.beginPath();
            chartCtx.moveTo(padLeft, padTop);
            chartCtx.lineTo(padLeft, h - padBottom);
            chartCtx.lineTo(w - padRight, h - padBottom);
            chartCtx.stroke();

            // Calculate max count per hour
            let maxH = 0;
            for (let i = 0; i < 24; i++) {
                const c = logs.filter(l => new Date(l.timestamp).getHours() === i).length;
                if (c > maxH) maxH = c;
            }
            const yMax = Math.max(maxH + 1, 5);

            // Y-axis labels
            chartCtx.fillStyle = isDark ? '#aaa' : '#666';
            chartCtx.textAlign = 'right';
            chartCtx.textBaseline = 'middle';
            const ySteps = Math.min(yMax, 5);
            for (let i = 0; i <= ySteps; i++) {
                const val = Math.round((yMax / ySteps) * i);
                const y = h - padBottom - (i / ySteps) * (h - padTop - padBottom);
                chartCtx.fillText(val.toString(), padLeft - 8, y);

                // Grid line
                chartCtx.strokeStyle = isDark ? '#333' : '#eee';
                chartCtx.beginPath();
                chartCtx.moveTo(padLeft, y);
                chartCtx.lineTo(w - padRight, y);
                chartCtx.stroke();
            }

            // X-axis labels (hours)
            chartCtx.fillStyle = isDark ? '#aaa' : '#666';
            chartCtx.textAlign = 'center';
            chartCtx.textBaseline = 'top';
            const chartWidth = w - padLeft - padRight;
            for (let hr = 0; hr <= 24; hr += 4) {
                const x = padLeft + (hr / 24) * chartWidth;
                chartCtx.fillText(hr.toString().padStart(2, '0') + ':00', x, h - padBottom + 8);
            }

            // Draw lines for each category
            const cats = [...new Set(logs.map(l => l.category))];
            const chartHeight = h - padTop - padBottom;

            cats.forEach(cat => {
                chartCtx.strokeStyle = isDark ? wheelData[cat].darkColor : wheelData[cat].color;
                chartCtx.lineWidth = 3;
                chartCtx.beginPath();

                for (let hr = 0; hr <= 24; hr++) {
                    const c = logs.filter(l => l.category === cat && new Date(l.timestamp).getHours() === hr).length;
                    const x = padLeft + (hr / 24) * chartWidth;
                    const y = h - padBottom - (c / yMax) * chartHeight;

                    if (hr === 0) chartCtx.moveTo(x, y);
                    else chartCtx.lineTo(x, y);
                }
                chartCtx.stroke();
            });
        }

        function drawLegend() {
            const isDark = document.body.classList.contains('dark-mode');
            document.getElementById('timelineLegend').innerHTML = Object.keys(wheelData).map(cat => `
                <div class="legend-item">
                    <div class="legend-color" style="background: ${isDark ? wheelData[cat].darkColor : wheelData[cat].color}"></div>
                    <span>${cat}</span>
                </div>`).join('');
        }

        function getCatWeight(d) { return Math.max(d.middleLayer.length, d.outerLayer.length); }
        function getTotalWeights() { let t=0; for(let k in wheelData) t += getCatWeight(wheelData[k]); return t; }
        function toggleDarkMode() { document.body.classList.toggle('dark-mode'); drawWheel(); updateStats(); }
        function checkSystemDarkMode() { if(window.matchMedia('(prefers-color-scheme: dark)').matches) document.body.classList.add('dark-mode'); }
        function deleteLog(id) { emotionLogs = emotionLogs.filter(l => l.id !== id); localStorage.setItem('emotionLogs', JSON.stringify(emotionLogs)); updateStats(); }
        function clearTodayLogs() { if(confirm('Clear today?')) { const t = new Date().toISOString().split('T')[0]; emotionLogs = emotionLogs.filter(l => l.date !== t); localStorage.setItem('emotionLogs', JSON.stringify(emotionLogs)); updateStats(); } }
        function downloadData(type) { const d = type === 'day' ? emotionLogs.filter(l => l.date === new Date().toISOString().split('T')[0]) : emotionLogs; const b = new Blob([JSON.stringify(d, null, 2)], {type:'application/json'}); const u = URL.createObjectURL(b); const a = document.createElement('a'); a.href = u; a.download = 'emotions.json'; a.click(); }

        window.onresize = updateStats;
        init();
    </script>
</body>
</html>
