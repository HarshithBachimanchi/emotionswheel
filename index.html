<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <meta name="color-scheme" content="light dark">
    <title>Feelings Wheel Tracker</title>
    <style>
        :root {
            --bg-color: #ffffff;
            --text-color: #333;
            --card-bg: #ffffff;
            --section-bg: #f8f8f8;
            --border-color: #e0e0e0;
            --shadow: rgba(0,0,0,0.1);
        }

        body.dark-mode {
            --bg-color: #1a1a1a;
            --text-color: #e0e0e0;
            --card-bg: #2a2a2a;
            --section-bg: #242424;
            --border-color: #404040;
            --shadow: rgba(0,0,0,0.3);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: var(--bg-color);
            color: var(--text-color);
            transition: background 0.3s, color 0.3s;
            overflow-x: hidden;
        }

        .dark-mode-toggle {
            position: fixed; top: 20px; right: 20px;
            background: var(--card-bg); color: var(--text-color); border: 1px solid var(--border-color);
            width: 44px; height: 44px; border-radius: 50%;
            cursor: pointer; display: flex; align-items: center; justify-content: center;
            z-index: 1000; box-shadow: 0 4px 12px var(--shadow);
        }

        .container { max-width: 1000px; margin: 0 auto; padding: 20px; }
        h1 { text-align: center; margin-top: 20px; font-weight: normal; font-size: 28px; }
        .subtitle { text-align: center; opacity: 0.7; margin-bottom: 20px; font-size: 14px; }

        .wheel-section {
            display: flex; flex-direction: column; align-items: center;
            padding: 10px 0 40px 0; min-height: 75vh; overflow: hidden;
        }
        
        .wheel-container {
            width: 95vw; max-width: 850px; aspect-ratio: 1 / 1;
            position: relative; margin: 0 auto;
            touch-action: pan-y pinch-zoom;
        }

        #wheelCanvas {
            width: 100%; height: 100%;
            display: block; cursor: grab;
            will-change: transform;
            transform-origin: center center;
            -webkit-tap-highlight-color: transparent;
        }

        /* Feedback Toast */
        #toast {
            position: fixed; bottom: -100px; left: 50%; transform: translateX(-50%);
            background: #333; color: #fff; padding: 12px 28px; border-radius: 30px;
            font-weight: 500; transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 9999; box-shadow: 0 10px 20px rgba(0,0,0,0.3);
        }
        #toast.show { bottom: 40px; }

        .stats-section {
            background: var(--section-bg); padding: 40px 20px;
            border-top: 1px solid var(--border-color);
        }

        .chart-wrapper {
            background: var(--card-bg); border: 1px solid var(--border-color);
            border-radius: 12px; padding: 20px; margin: 0 auto 40px;
        }

        .chart-scroll-container {
            overflow-x: auto; -webkit-overflow-scrolling: touch; padding-bottom: 10px;
        }
        .chart-scroll-container canvas { min-width: 600px; height: 320px; }

        .legend-container {
            display: flex; flex-wrap: wrap; justify-content: center;
            gap: 15px; margin-top: 15px; font-size: 12px;
        }
        .legend-item { display: flex; align-items: center; gap: 5px; }
        .legend-color { width: 12px; height: 12px; border-radius: 2px; }

        .logs-container { 
            max-height: 400px; overflow-y: auto; background: var(--card-bg);
            border: 1px solid var(--border-color); border-radius: 12px; margin-bottom: 20px;
        }
        .log-entry {
            padding: 16px; border-bottom: 1px solid var(--border-color);
            display: flex; justify-content: space-between; align-items: center;
        }

        .button-group {
            display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin-top: 20px;
        }
        .action-btn {
            background: var(--card-bg); border: 1px solid var(--border-color);
            color: var(--text-color); padding: 12px 24px; cursor: pointer;
            border-radius: 8px; font-size: 14px; transition: all 0.2s;
        }
        .btn-danger { color: #e74c3c; border-color: rgba(231, 76, 60, 0.3); }

        .date-display { text-align: center; margin-bottom: 20px; font-size: 16px; font-weight: bold; }
    </style>
</head>
<body>
    <button class="dark-mode-toggle" onclick="toggleDarkMode()">🌓</button>
    <div id="toast">Logged!</div>
    
    <div class="wheel-section">
        <h1>Feelings Wheel</h1>
        <p class="subtitle">Rotate to the right to read. Tap an emotion to log.</p>
        <div class="wheel-container">
            <canvas id="wheelCanvas" width="5000" height="5000"></canvas>
        </div>
    </div>

    <div class="stats-section">
        <div class="container">
            <div class="date-display" id="todayDate"></div>

            <div class="chart-wrapper">
                <h3 style="text-align:center; margin-bottom:15px;">Daily Distribution</h3>
                <div class="chart-scroll-container"><canvas id="barChart"></canvas></div>
            </div>

            <div class="chart-wrapper">
                <h3 style="text-align:center; margin-bottom:15px;">Emotion Timeline</h3>
                <div class="chart-scroll-container"><canvas id="lineChart"></canvas></div>
                <div class="legend-container" id="timelineLegend"></div>
            </div>

            <div class="logs-container" id="logsContainer"></div>
            
            <div class="button-group">
                <button class="action-btn" onclick="downloadData('day')">Download Today</button>
                <button class="action-btn" onclick="downloadData('all')">Download All</button>
                <button class="action-btn btn-danger" onclick="clearTodayLogs()">Clear Today</button>
            </div>
        </div>
    </div>

    <script>
        const CX = 2500, CY = 2500, R0 = 336, R1 = 756, R2 = 1540, R3 = 2180;
        const INTERACTION_MARGIN = 400;

        const wheelData = {
            "Happy": { color: "#F9E79F", middleColor: "#FEF5D4", outerColor: "#F9E79F", darkColor: "#8B7355", middleLayer: ["Content", "Playful", "Excited", "Interested", "Proud", "Accepted", "Powerful", "Peaceful", "Trusting", "Optimistic"], outerLayer: ["Joyful", "Free", "Cheeky", "Aroused", "Curious", "Inquisitive", "Successful", "Confident", "Respected", "Valued", "Courageous", "Creative", "Loving", "Thankful", "Sensitive", "Intimate", "Hopeful", "Inspired"] },
            "Sad": { color: "#A9CCE3", middleColor: "#D6EAF8", outerColor: "#A9CCE3", darkColor: "#4A6B7C", middleLayer: ["Lonely", "Vulnerable", "Despair", "Guilty", "Depressed", "Hurt"], outerLayer: ["Isolated", "Abandoned", "Victimized", "Fragile", "Grief", "Powerless", "Ashamed", "Remorseful", "Empty", "Inferior", "Embarrassed", "Hesitant", "Humiliated", "Horrible"] },
            "Disgusted": { color: "#B8B8B8", middleColor: "#D9D9D9", outerColor: "#B8B8B8", darkColor: "#5A5A5A", middleLayer: ["Disapproving", "Disappointed", "Awful", "Repelled"], outerLayer: ["Judgmental", "Embarrassed", "Appalled", "Revolted", "Nauseated", "Detestable", "Horrified", "Hesitant"] },
            "Angry": { color: "#F5B7B1", middleColor: "#FADBD8", outerColor: "#F5B7B1", darkColor: "#8B5A56", middleLayer: ["Mad", "Aggressive", "Frustrated", "Distant", "Critical"], outerLayer: ["Furious", "Jealous", "Provoked", "Hostile", "Infuriated", "Annoyed", "Withdrawn", "Numb", "Skeptical", "Dismissive", "Let down", "Humiliated", "Bitter", "Violated", "Indignant", "Ridiculed", "Disrespected", "Resentful", "Betrayed"] },
            "Fearful": { color: "#FAD7A0", middleColor: "#FDEBD0", outerColor: "#FAD7A0", darkColor: "#8B6F50", middleLayer: ["Scared", "Anxious", "Insecure", "Weak", "Rejected", "Threatened"], outerLayer: ["Helpless", "Frightened", "Overwhelmed", "Worried", "Inadequate", "Inferior", "Worthless", "Insignificant", "Excluded", "Persecuted", "Nervous", "Exposed"] },
            "Bad": { color: "#A9DFBF", middleColor: "#D5F4E6", outerColor: "#A9DFBF", darkColor: "#4A6F5F", middleLayer: ["Bored", "Busy", "Stressed", "Tired"], outerLayer: ["Indifferent", "Apathetic", "Pressured", "Rushed", "Overwhelmed", "Out of control", "Sleepy", "Unfocused"] },
            "Surprised": { color: "#D7BDE2", middleColor: "#E8DAEF", outerColor: "#D7BDE2", darkColor: "#6B5D71", middleLayer: ["Startled", "Confused", "Amazed", "Excited"], outerLayer: ["Shocked", "Dismayed", "Perplexed", "Astonished", "Awe", "Eager", "Energetic", "Disillusioned"] }
        };

        let emotionLogs = JSON.parse(localStorage.getItem('emotionLogs')) || [];
        let wheelRotation = 0, isDragging = false, dragStartAngle = 0, rotationStart = 0;
        
        const canvas = document.getElementById('wheelCanvas');
        const ctx = canvas.getContext('2d');

        function init() {
            document.getElementById('todayDate').textContent = "Activity for " + new Date().toLocaleDateString();
            if(localStorage.getItem('darkMode') === 'enabled' || (window.matchMedia('(prefers-color-scheme: dark)').matches && !localStorage.getItem('darkMode'))) {
                document.body.classList.add('dark-mode');
            }
            drawWheel();
            updateStats();
            setupEvents();
        }

        function drawWheel() {
            const isDark = document.body.classList.contains('dark-mode');
            ctx.clearRect(0, 0, 5000, 5000);
            let sA = 0;
            const total = Object.values(wheelData).reduce((a, b) => a + Math.max(b.middleLayer.length, b.outerLayer.length), 0);

            Object.entries(wheelData).forEach(([cat, data]) => {
                const span = (Math.max(data.middleLayer.length, data.outerLayer.length) / total) * Math.PI * 2;
                
                drawSeg(R0, R1, sA, sA+span, isDark ? data.darkColor : data.color);
                drawTxt(sA+span/2, (R0+R1)/2, cat, '84px', isDark);

                const mStep = span / data.middleLayer.length;
                data.middleLayer.forEach((t, i) => {
                    const a = sA + i * mStep;
                    drawSeg(R1, R2, a, a + mStep, isDark ? "#444" : data.middleColor);
                    drawTxt(a + mStep/2, (R1+R2)/2, t, '72px', isDark);
                });

                const oStep = span / data.outerLayer.length;
                data.outerLayer.forEach((t, i) => {
                    const a = sA + i * oStep;
                    drawSeg(R2, R3, a, a + oStep, isDark ? "#333" : data.outerColor);
                    drawTxt(a + oStep/2, (R2+R3)/2, t, '68px', isDark);
                });
                sA += span;
            });
        }

        function drawSeg(r1, r2, s, e, c) {
            ctx.beginPath(); ctx.arc(CX, CY, r2, s, e); ctx.arc(CX, CY, r1, e, s, true);
            ctx.fillStyle = c; ctx.fill(); ctx.strokeStyle = 'white'; ctx.lineWidth = 8; ctx.stroke();
        }

        function drawTxt(a, r, t, s, isDark) {
            ctx.save(); ctx.translate(CX+Math.cos(a)*r, CY+Math.sin(a)*r); ctx.rotate(a);
            ctx.fillStyle = isDark ? '#fff' : '#000'; ctx.font = `600 ${s} sans-serif`;
            ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText(t, 0,0); ctx.restore();
        }

        function setupEvents() {
            const getA = (e) => {
                const rect = canvas.getBoundingClientRect();
                const x = (e.touches ? e.touches[0].clientX : e.clientX) - (rect.left + rect.width/2);
                const y = (e.touches ? e.touches[0].clientY : e.clientY) - (rect.top + rect.height/2);
                return Math.atan2(y, x);
            };

            const onStart = e => {
                const rect = canvas.getBoundingClientRect();
                const scale = 5000/rect.width;
                const pX = ((e.touches ? e.touches[0].clientX : e.clientX) - rect.left) * scale - CX;
                const pY = ((e.touches ? e.touches[0].clientY : e.clientY) - rect.top) * scale - CY;
                if(Math.sqrt(pX*pX + pY*pY) < R3 + INTERACTION_MARGIN) {
                    isDragging = true;
                    dragStartAngle = getA(e);
                    rotationStart = wheelRotation;
                }
            };

            const onMove = e => {
                if(!isDragging) return;
                wheelRotation = rotationStart + (getA(e) - dragStartAngle);
                canvas.style.transform = `rotate(${wheelRotation}rad)`;
            };

            const onEnd = e => {
                if(!isDragging) return;
                isDragging = false;
                if(Math.abs(wheelRotation - rotationStart) < 0.05) {
                    const rect = canvas.getBoundingClientRect();
                    const p = e.changedTouches ? e.changedTouches[0] : e;
                    const scale = 5000/rect.width;
                    const dx = (p.clientX - rect.left) * scale - CX;
                    const dy = (p.clientY - rect.top) * scale - CY;
                    handleClick(dx, dy);
                }
            };

            canvas.addEventListener('mousedown', onStart);
            window.addEventListener('mousemove', onMove);
            window.addEventListener('mouseup', onEnd);
            canvas.addEventListener('touchstart', e => { if(e.touches.length === 1) onStart(e); }, {passive:false});
            window.addEventListener('touchmove', e => { if(isDragging) { e.preventDefault(); onMove(e); } }, {passive:false});
            window.addEventListener('touchend', onEnd);
        }

        function handleClick(dx, dy) {
            const dist = Math.sqrt(dx*dx + dy*dy);
            if(dist < R0 || dist > R3) return;

            let angle = (Math.atan2(dy, dx) - wheelRotation) % (Math.PI*2);
            if(angle < 0) angle += Math.PI*2;

            const total = Object.values(wheelData).reduce((a, b) => a + Math.max(b.middleLayer.length, b.outerLayer.length), 0);
            let curr = 0;
            for(const [cat, data] of Object.entries(wheelData)) {
                const span = (Math.max(data.middleLayer.length, data.outerLayer.length) / total) * Math.PI*2;
                if(angle >= curr && angle < curr + span) {
                    let emo, local = angle - curr;
                    if(dist < R1) emo = cat;
                    else if(dist < R2) emo = data.middleLayer[Math.floor(local/(span/data.middleLayer.length))];
                    else emo = data.outerLayer[Math.floor(local/(span/data.outerLayer.length))];
                    if(emo) logEmo(emo, cat);
                    break;
                }
                curr += span;
            }
        }

        function logEmo(emo, cat) {
            const now = new Date();
            emotionLogs.unshift({ id: Date.now(), emotion: emo, category: cat, time: now.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}), date: now.toISOString().split('T')[0], timestamp: now.getTime() });
            localStorage.setItem('emotionLogs', JSON.stringify(emotionLogs));
            
            const t = document.getElementById('toast');
            t.textContent = `Logged: ${emo}`;
            t.classList.add('show');
            setTimeout(() => t.classList.remove('show'), 2000);
            
            updateStats();
        }

        function updateStats() {
            const today = new Date().toISOString().split('T')[0];
            const logs = emotionLogs.filter(l => l.date === today);
            document.getElementById('logsContainer').innerHTML = logs.map(l => `
                <div class="log-entry">
                    <span><strong>${l.emotion}</strong> <small>(${l.category})</small></span>
                    <span>${l.time} <button style="border:none;background:none;cursor:pointer;margin-left:8px" onclick="deleteLog(${l.id})">×</button></span>
                </div>`).join('') || '<div style="padding:20px;text-align:center;opacity:0.5">No emotions logged today</div>';
            
            renderCharts(logs);
        }

        function renderCharts(logs) {
            const dpr = window.devicePixelRatio || 1;
            const isDark = document.body.classList.contains('dark-mode');

            // Bar Chart
            const bC = document.getElementById('barChart'), bCtx = bC.getContext('2d'), bR = bC.getBoundingClientRect();
            bC.width = bR.width * dpr; bC.height = bR.height * dpr; bCtx.scale(dpr, dpr);
            if(logs.length) {
                const counts = {}; logs.forEach(l => counts[l.category] = (counts[l.category]||0)+1);
                const keys = Object.keys(counts), max = Math.max(...Object.values(counts));
                keys.forEach((k, i) => {
                    const bh = (counts[k]/max)*200, bw = Math.min(60, (bR.width-100)/keys.length), x = 60 + i*((bR.width-100)/keys.length);
                    bCtx.fillStyle = isDark ? wheelData[k].darkColor : wheelData[k].color;
                    bCtx.fillRect(x, 240-bh, bw, bh);
                    bCtx.fillStyle = isDark ? '#fff' : '#333'; bCtx.textAlign='center';
                    bCtx.fillText(counts[k], x+bw/2, 235-bh);
                    bCtx.save(); bCtx.translate(x+bw/2, 255); if(keys.length > 5) bCtx.rotate(0.2); bCtx.fillText(k, 0,0); bCtx.restore();
                });
            }

            // Timeline Chart
            const lC = document.getElementById('lineChart'), lCtx = lC.getContext('2d'), lR = lC.getBoundingClientRect();
            lC.width = lR.width * dpr; lC.height = lR.height * dpr; lCtx.scale(dpr, dpr);
            const cats = [...new Set(logs.map(l => l.category))];
            cats.forEach(cat => {
                lCtx.strokeStyle = isDark ? wheelData[cat].darkColor : wheelData[cat].color;
                lCtx.lineWidth = 3; lCtx.beginPath();
                for(let h=0; h<=24; h++) {
                    const c = logs.filter(l => l.category === cat && new Date(l.timestamp).getHours() === h).length;
                    const x = 40 + (h/24)*(lR.width-80), y = 260 - (c/5)*200;
                    if(h===0) lCtx.moveTo(x,y); else lCtx.lineTo(x,y);
                }
                lCtx.stroke();
            });

            document.getElementById('timelineLegend').innerHTML = Object.keys(wheelData).map(k => `
                <div class="legend-item"><div class="legend-color" style="background:${isDark ? wheelData[k].darkColor : wheelData[k].color}"></div>${k}</div>
            `).join('');
        }

        function toggleDarkMode() {
            document.body.classList.toggle('dark-mode');
            localStorage.setItem('darkMode', document.body.classList.contains('dark-mode') ? 'enabled' : 'disabled');
            drawWheel(); updateStats();
        }

        function deleteLog(id) { emotionLogs = emotionLogs.filter(l => l.id !== id); localStorage.setItem('emotionLogs', JSON.stringify(emotionLogs)); updateStats(); }
        function clearTodayLogs() { if(confirm('Clear today?')) { const t = new Date().toISOString().split('T')[0]; emotionLogs = emotionLogs.filter(l => l.date !== t); localStorage.setItem('emotionLogs', JSON.stringify(emotionLogs)); updateStats(); } }
        function downloadData(type) { const d = type==='day' ? emotionLogs.filter(l => l.date === new Date().toISOString().split('T')[0]) : emotionLogs; const b = new Blob([JSON.stringify(d,null,2)],{type:'application/json'}); const u = URL.createObjectURL(b); const a = document.createElement('a'); a.href=u; a.download='emotions.json'; a.click(); }

        window.onresize = updateStats;
        init();
    </script>
</body>
</html>
