<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <meta name="color-scheme" content="light dark">
    <title>Feelings Wheel Tracker</title>
    <style>
        :root {
            --bg-color: #ffffff;
            --text-color: #333;
            --card-bg: #ffffff;
            --section-bg: #f8f8f8;
            --border-color: #e0e0e0;
            --shadow: rgba(0,0,0,0.1);
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg-color: #1a1a1a;
                --text-color: #e0e0e0;
                --card-bg: #2a2a2a;
                --section-bg: #242424;
                --border-color: #404040;
                --shadow: rgba(0,0,0,0.3);
            }
        }

        body.dark-mode {
            --bg-color: #1a1a1a;
            --text-color: #e0e0e0;
            --card-bg: #2a2a2a;
            --section-bg: #242424;
            --border-color: #404040;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: var(--bg-color);
            color: var(--text-color);
            transition: background 0.3s, color 0.3s;
            overflow-x: hidden;
        }

        /* --- UI Components --- */
        .dark-mode-toggle {
            position: fixed; top: 20px; right: 20px;
            background: var(--card-bg); color: var(--text-color); border: 1px solid var(--border-color);
            width: 50px; height: 50px; border-radius: 50%;
            cursor: pointer; display: flex; align-items: center; justify-content: center;
            z-index: 1000; box-shadow: 0 4px 12px var(--shadow);
        }

        .container { max-width: 1400px; margin: 0 auto; padding: 40px 20px; }
        h1 { text-align: center; margin-bottom: 20px; font-weight: normal; }
        .subtitle { text-align: center; opacity: 0.7; margin-bottom: 40px; font-size: 14px; line-height: 1.6; }

        /* --- Wheel Section --- */
        .wheel-section {
            display: flex; flex-direction: column; align-items: center;
            padding: 40px 10px; min-height: 80vh; overflow: hidden;
        }
        
        .wheel-container {
            width: 100%;
            max-width: 900px; /* Limit size on desktop */
            aspect-ratio: 1 / 1;
            position: relative;
            margin: 0 auto;
        }

        #wheelCanvas {
            width: 100%;
            height: 100%;
            display: block;
            cursor: grab;
            /* GPU Acceleration */
            will-change: transform; 
            transform-origin: center center;
            /* Disable default touch actions only for single finger drag, 
               but we handle this in JS to allow pinch-zoom */
            -webkit-tap-highlight-color: transparent;
        }
        #wheelCanvas:active { cursor: grabbing; }

        .tooltip {
            position: fixed; background: rgba(0, 0, 0, 0.9); color: white;
            padding: 8px 14px; font-size: 14px; pointer-events: none;
            display: none; z-index: 1000; border-radius: 6px;
        }

        /* --- Stats & Logs --- */
        .stats-section {
            background: var(--section-bg); padding: 40px 20px;
            border-top: 1px solid var(--border-color);
        }

        .stat-card {
            background: var(--card-bg); padding: 24px; text-align: center;
            border: 1px solid var(--border-color); border-radius: 12px;
        }
        .stats-grid {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px; max-width: 1000px; margin: 0 auto 40px;
        }

        /* --- Charts --- */
        .chart-wrapper {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            margin: 0 auto 40px;
            max-width: 1000px;
            position: relative;
        }

        /* The scrollable area for mobile charts */
        .chart-scroll-container {
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            padding-bottom: 10px; /* Space for scrollbar */
        }
        
        .chart-scroll-container canvas {
            /* On mobile, force min-width to ensure labels don't merge */
            min-width: 600px; 
            height: 300px;
        }

        /* On desktop, fit to container */
        @media (min-width: 768px) {
            .chart-scroll-container canvas {
                width: 100% !important;
                min-width: auto;
            }
        }

        .chart-tooltip {
            position: absolute; background: rgba(0,0,0,0.9); color: white;
            padding: 8px; font-size: 12px; pointer-events: none;
            display: none; border-radius: 4px; z-index: 100;
        }

        .logs-container { 
            max-height: 400px; overflow-y: auto; background: var(--card-bg);
            border: 1px solid var(--border-color); border-radius: 12px;
        }
        .log-entry {
            padding: 16px; border-bottom: 1px solid var(--border-color);
            display: flex; justify-content: space-between; align-items: center;
        }
        
        .action-btn {
            background: var(--card-bg); border: 1px solid var(--border-color);
            color: var(--text-color); padding: 10px 20px; cursor: pointer; margin: 5px;
        }
        .action-btn:hover { background: var(--border-color); }

        .date-controls { text-align: center; margin-bottom: 20px; }
        .date-controls button {
            background: var(--text-color); color: var(--bg-color);
            border: none; padding: 8px 16px; cursor: pointer; border-radius: 4px;
        }
    </style>
</head>
<body>
    <button class="dark-mode-toggle" onclick="toggleDarkMode()">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
    </button>
    
    <div class="tooltip" id="tooltip"></div>
    
    <div class="wheel-section">
        <h1>Feelings Wheel</h1>
        <p class="subtitle">Spin to find your emotion.<br>Pinch anywhere to zoom the page.</p>
        <div class="wheel-container">
            <canvas id="wheelCanvas" width="4400" height="4400"></canvas>
        </div>
    </div>

    <div class="stats-section">
        <div class="container">
            <div class="date-controls">
                <span>Today: <strong id="todayDate"></strong></span>
                <button onclick="clearTodayLogs()" style="margin-left: 15px;">Clear Today</button>
            </div>

            <div class="stats-grid" id="statsContainer"></div>

            <div class="chart-wrapper">
                <h3 style="text-align:center; margin-bottom:15px;">Daily Distribution</h3>
                <div class="chart-scroll-container">
                    <canvas id="barChart"></canvas>
                </div>
                <div class="chart-tooltip" id="barTooltip"></div>
            </div>

            <div class="chart-wrapper">
                <h3 style="text-align:center; margin-bottom:15px;">Emotion Timeline</h3>
                <div class="chart-scroll-container">
                    <canvas id="lineChart"></canvas>
                </div>
            </div>

            <div class="logs-container" id="logsContainer"></div>
            
            <div style="text-align: center; margin-top: 20px;">
                <button class="action-btn" onclick="downloadData('day')">Download Today</button>
                <button class="action-btn" onclick="downloadData('all')">Download All</button>
            </div>
        </div>
    </div>

    <script>
        // --- Configuration & Constants ---
        // Increased sizes by ~40% for better readability and touch targets
        const CENTER_RADIUS = 336;  // was 240
        const INNER_RADIUS = 756;   // was 540
        const MIDDLE_RADIUS = 1540; // was 1100
        const OUTER_RADIUS = 2180;  // was 1560
        // Canvas Center
        const CW = 4400; 
        const CH = 4400;
        const CX = CW / 2;
        const CY = CH / 2;

        const wheelData = {
            "Happy": {
                color: "#F9E79F", middleColor: "#FEF5D4", outerColor: "#FFFCF0",
                darkColor: "#8B7355", darkMiddleColor: "#6B5D4F", darkOuterColor: "#5B4D3F",
                middleLayer: ["Content", "Playful", "Excited", "Interested", "Proud", "Accepted", "Powerful", "Peaceful", "Trusting", "Optimistic"],
                outerLayer: ["Joyful", "Free", "Cheeky", "Aroused", "Curious", "Inquisitive", "Successful", "Confident", "Respected", "Valued", "Courageous", "Creative", "Loving", "Thankful", "Sensitive", "Intimate", "Hopeful", "Inspired"]
            },
            "Sad": {
                color: "#A9CCE3", middleColor: "#D6EAF8", outerColor: "#EBF5FB",
                darkColor: "#4A6B7C", darkMiddleColor: "#3A5B6C", darkOuterColor: "#2A4B5C",
                middleLayer: ["Lonely", "Vulnerable", "Despair", "Guilty", "Depressed", "Hurt"],
                outerLayer: ["Isolated", "Abandoned", "Victimized", "Fragile", "Grief", "Powerless", "Ashamed", "Remorseful", "Empty", "Inferior", "Embarrassed", "Hesitant", "Humiliated", "Horrible"]
            },
            "Disgusted": {
                color: "#B8B8B8", middleColor: "#D9D9D9", outerColor: "#EEEEEE",
                darkColor: "#5A5A5A", darkMiddleColor: "#4A4A4A", darkOuterColor: "#3A3A3A",
                middleLayer: ["Disapproving", "Disappointed", "Awful", "Repelled"],
                outerLayer: ["Judgmental", "Embarrassed", "Appalled", "Revolted", "Nauseated", "Detestable", "Horrified", "Hesitant"]
            },
            "Angry": {
                color: "#F5B7B1", middleColor: "#FADBD8", outerColor: "#FEF0EF",
                darkColor: "#8B5A56", darkMiddleColor: "#7B4A46", darkOuterColor: "#6B3A36",
                middleLayer: ["Mad", "Aggressive", "Frustrated", "Distant", "Critical"],
                outerLayer: ["Furious", "Jealous", "Provoked", "Hostile", "Infuriated", "Annoyed", "Withdrawn", "Numb", "Skeptical", "Dismissive", "Let down", "Humiliated", "Bitter", "Violated", "Indignant", "Ridiculed", "Disrespected", "Resentful", "Betrayed"]
            },
            "Fearful": {
                color: "#FAD7A0", middleColor: "#FDEBD0", outerColor: "#FEF5E7",
                darkColor: "#8B6F50", darkMiddleColor: "#7B5F40", darkOuterColor: "#6B4F30",
                middleLayer: ["Scared", "Anxious", "Insecure", "Weak", "Rejected", "Threatened"],
                outerLayer: ["Helpless", "Frightened", "Overwhelmed", "Worried", "Inadequate", "Inferior", "Worthless", "Insignificant", "Excluded", "Persecuted", "Nervous", "Exposed"]
            },
            "Bad": {
                color: "#A9DFBF", middleColor: "#D5F4E6", outerColor: "#EAFAF1",
                darkColor: "#4A6F5F", darkMiddleColor: "#3A5F4F", darkOuterColor: "#2A4F3F",
                middleLayer: ["Bored", "Busy", "Stressed", "Tired"],
                outerLayer: ["Indifferent", "Apathetic", "Pressured", "Rushed", "Overwhelmed", "Out of control", "Sleepy", "Unfocused"]
            },
            "Surprised": {
                color: "#D7BDE2", middleColor: "#E8DAEF", outerColor: "#F4ECF7",
                darkColor: "#6B5D71", darkMiddleColor: "#5B4D61", darkOuterColor: "#4B3D51",
                middleLayer: ["Startled", "Confused", "Amazed", "Excited"],
                outerLayer: ["Shocked", "Dismayed", "Perplexed", "Astonished", "Awe", "Eager", "Energetic", "Disillusioned"]
            }
        };

        // --- State ---
        let emotionLogs = JSON.parse(localStorage.getItem('emotionLogs')) || [];
        
        // Rotation Physics
        let wheelRotation = 0;      // Current CSS rotation (radians)
        let isDragging = false;
        let dragStartAngle = 0;
        let rotationStart = 0;      // Rotation value when drag started
        let velocity = 0;
        let lastTime = 0;
        let inertiaId = null;

        // Elements
        const canvas = document.getElementById('wheelCanvas');
        const ctx = canvas.getContext('2d', { alpha: false }); // Optimization
        const tooltip = document.getElementById('tooltip');
        
        // --- Initialization ---
        function init() {
            document.getElementById('todayDate').textContent = new Date().toLocaleDateString();
            checkSystemDarkMode();
            drawWheel(); // Draw once!
            updateStats();
            setupEvents();
            setupInertiaLoop();
        }

        // --- Drawing (Executed ONCE per theme change) ---
        function drawWheel() {
            const isDark = document.body.classList.contains('dark-mode');
            
            ctx.fillStyle = isDark ? '#1a1a1a' : '#ffffff';
            ctx.fillRect(0, 0, CW, CH);

            let startAngle = 0;
            const totalEmotions = getTotalEmotionCount();

            Object.entries(wheelData).forEach(([category, data]) => {
                const count = Math.max(data.middleLayer.length, data.outerLayer.length);
                const span = (count / totalEmotions) * (2 * Math.PI);
                const endAngle = startAngle + span;

                const c1 = isDark ? data.darkColor : data.color;
                const c2 = isDark ? data.darkMiddleColor : data.middleColor;
                const c3 = isDark ? data.darkOuterColor : data.outerColor;

                // Core
                drawSegment(CENTER_RADIUS, INNER_RADIUS, startAngle, endAngle, c1);
                drawText(startAngle + span/2, (CENTER_RADIUS+INNER_RADIUS)/2, category, '84px', isDark);

                // Middle
                const midStep = span / data.middleLayer.length;
                data.middleLayer.forEach((text, i) => {
                    const a1 = startAngle + i * midStep;
                    drawSegment(INNER_RADIUS, MIDDLE_RADIUS, a1, a1 + midStep, c2);
                    drawText(a1 + midStep/2, (INNER_RADIUS+MIDDLE_RADIUS)/2, text, '72px', isDark);
                });

                // Outer
                const outStep = span / data.outerLayer.length;
                data.outerLayer.forEach((text, i) => {
                    const a1 = startAngle + i * outStep;
                    // In light mode, keep outer ring same color or slightly lighter. 
                    // To match user design, we use base color in light mode for contrast
                    const col = isDark ? c3 : c1; 
                    drawSegment(MIDDLE_RADIUS, OUTER_RADIUS, a1, a1 + outStep, col);
                    drawText(a1 + outStep/2, (MIDDLE_RADIUS+OUTER_RADIUS)/2, text, '68px', isDark);
                });

                startAngle = endAngle;
            });

            // Center
            ctx.beginPath();
            ctx.arc(CX, CY, CENTER_RADIUS, 0, 2*Math.PI);
            ctx.fillStyle = isDark ? '#2a2a2a' : '#fff';
            ctx.fill();
            ctx.strokeStyle = isDark ? '#444' : '#ddd';
            ctx.lineWidth = 10;
            ctx.stroke();
        }

        function drawSegment(rIn, rOut, start, end, color) {
            ctx.beginPath();
            ctx.arc(CX, CY, rOut, start, end);
            ctx.arc(CX, CY, rIn, end, start, true);
            ctx.fillStyle = color;
            ctx.fill();
            ctx.strokeStyle = 'white'; // Always white separators
            ctx.lineWidth = 8;
            ctx.stroke();
        }

        function drawText(angle, radius, text, size, isDark) {
            const x = CX + Math.cos(angle) * radius;
            const y = CY + Math.sin(angle) * radius;
            
            ctx.save();
            ctx.translate(x, y);
            let rot = angle;
            if (rot > Math.PI/2 && rot < 3*Math.PI/2) rot += Math.PI;
            ctx.rotate(rot);
            
            ctx.fillStyle = isDark ? '#fff' : '#000';
            ctx.font = `600 ${size} -apple-system, sans-serif`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(text, 0, 0);
            ctx.restore();
        }

        // --- Interaction Logic (The Smooth Part) ---
        function setupEvents() {
            // Touch
            canvas.addEventListener('touchstart', onTouchStart, {passive: false});
            window.addEventListener('touchmove', onTouchMove, {passive: false});
            window.addEventListener('touchend', onTouchEnd);
            
            // Mouse
            canvas.addEventListener('mousedown', onMouseDown);
            window.addEventListener('mousemove', onMouseMove);
            window.addEventListener('mouseup', onMouseUp);
        }

        function getAngle(x, y) {
            const rect = canvas.getBoundingClientRect();
            // Calculate center relative to viewport
            const cx = rect.left + rect.width/2;
            const cy = rect.top + rect.height/2;
            return Math.atan2(y - cy, x - cx);
        }

        // --- Mouse Handlers ---
        function onMouseDown(e) {
            isDragging = true;
            velocity = 0;
            dragStartAngle = getAngle(e.clientX, e.clientY);
            rotationStart = wheelRotation;
            lastTime = Date.now();
            canvas.style.cursor = 'grabbing';
        }

        function onMouseMove(e) {
            if (!isDragging) return;
            e.preventDefault();
            
            const currentAngle = getAngle(e.clientX, e.clientY);
            let delta = currentAngle - dragStartAngle;
            
            // Normalize
            if (delta > Math.PI) delta -= 2*Math.PI;
            if (delta < -Math.PI) delta += 2*Math.PI;

            wheelRotation = rotationStart + delta;
            applyRotation();

            // Calculate velocity
            const now = Date.now();
            if (now - lastTime > 0) {
                velocity = delta / (now - lastTime) * 16; // Scale to frames
            }
            lastTime = now;
        }

        function onMouseUp(e) {
            if (!isDragging) return;
            isDragging = false;
            canvas.style.cursor = 'grab';
            
            // Click Detection (minimal movement)
            if (Math.abs(wheelRotation - rotationStart) < 0.05) {
                handleClick(e.clientX, e.clientY);
            }
        }

        // --- Touch Handlers (Fixed Zoom) ---
        function onTouchStart(e) {
            if (e.touches.length > 1) {
                isDragging = false; // Allow pinch zoom
                return;
            }
            isDragging = true;
            velocity = 0;
            const t = e.touches[0];
            dragStartAngle = getAngle(t.clientX, t.clientY);
            rotationStart = wheelRotation;
            lastTime = Date.now();
        }

        function onTouchMove(e) {
            // Critical Fix: If 2 fingers, IGNORE so browser handles zoom
            if (e.touches.length > 1) {
                isDragging = false;
                return; 
            }
            
            if (!isDragging) return;
            
            // Prevent scrolling ONLY if we are actually rotating
            e.preventDefault(); 

            const t = e.touches[0];
            const currentAngle = getAngle(t.clientX, t.clientY);
            let delta = currentAngle - dragStartAngle;
            
            if (delta > Math.PI) delta -= 2*Math.PI;
            if (delta < -Math.PI) delta += 2*Math.PI;

            wheelRotation = rotationStart + delta;
            applyRotation();

            const now = Date.now();
            if (now - lastTime > 0) {
                velocity = delta / (now - lastTime) * 16;
            }
            lastTime = now;
        }

        function onTouchEnd(e) {
            if (!isDragging) return;
            isDragging = false;
            
            // Tap detection
            if (Math.abs(wheelRotation - rotationStart) < 0.05) {
                const t = e.changedTouches[0];
                handleClick(t.clientX, t.clientY);
            }
        }

        // --- Physics & Visuals ---
        function applyRotation() {
            // Use GPU transform
            canvas.style.transform = `rotate(${wheelRotation}rad)`;
        }

        function setupInertiaLoop() {
            function loop() {
                if (!isDragging && Math.abs(velocity) > 0.001) {
                    wheelRotation += velocity;
                    velocity *= 0.95; // Friction
                    applyRotation();
                }
                requestAnimationFrame(loop);
            }
            loop();
        }

        function handleClick(clientX, clientY) {
            const rect = canvas.getBoundingClientRect();
            // Map click to canvas coordinates (0-4400)
            const scale = CW / rect.width;
            const x = (clientX - rect.left) * scale;
            const y = (clientY - rect.top) * scale;
            
            const dx = x - CX;
            const dy = y - CY;
            const dist = Math.sqrt(dx*dx + dy*dy);
            
            // Map angle back through rotation
            let angle = Math.atan2(dy, dx) - wheelRotation;
            angle = angle % (2*Math.PI);
            if (angle < 0) angle += 2*Math.PI;

            if (dist < CENTER_RADIUS || dist > OUTER_RADIUS) return;

            const total = getTotalEmotionCount();
            let current = 0;

            for (const [cat, data] of Object.entries(wheelData)) {
                const count = Math.max(data.middleLayer.length, data.outerLayer.length);
                const span = (count / total) * (2*Math.PI);
                
                if (angle >= current && angle < current + span) {
                    const localAngle = angle - current;
                    
                    if (dist < INNER_RADIUS) {
                        log(cat, cat);
                    } else if (dist < MIDDLE_RADIUS) {
                        const step = span / data.middleLayer.length;
                        const idx = Math.floor(localAngle / step);
                        if (data.middleLayer[idx]) log(data.middleLayer[idx], cat);
                    } else {
                        const step = span / data.outerLayer.length;
                        const idx = Math.floor(localAngle / step);
                        if (data.outerLayer[idx]) log(data.outerLayer[idx], cat);
                    }
                    
                    // Simple flash effect: redraw wheel quickly 
                    // (Since we use CSS rotate, we'd need a complex overlay to flash smoothly.
                    // For now, visual feedback is the log appearing below)
                    break;
                }
                current += span;
            }
        }

        // --- Data & Charts ---
        function log(emotion, category) {
            const now = new Date();
            emotionLogs.unshift({
                id: Date.now(),
                emotion, category,
                date: now.toISOString().split('T')[0],
                time: now.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}),
                timestamp: now.getTime()
            });
            localStorage.setItem('emotionLogs', JSON.stringify(emotionLogs));
            updateStats();
        }

        function updateStats() {
            const today = new Date().toISOString().split('T')[0];
            const logs = emotionLogs.filter(l => l.date === today);
            
            // Render Logs
            const logHTML = logs.map(l => `
                <div class="log-entry">
                    <span><strong>${l.emotion}</strong> <small>(${l.category})</small></span>
                    <span>${l.time} <button style="margin-left:10px; border:none; background:none; color:#999;" onclick="deleteLog(${l.id})">×</button></span>
                </div>
            `).join('');
            document.getElementById('logsContainer').innerHTML = logHTML || '<div style="padding:20px; text-align:center; color:#999">No emotions logged today</div>';

            // Render Bar Chart
            drawBarChart(logs);
            drawLineChart(logs);
        }

        function drawBarChart(logs) {
            const cvs = document.getElementById('barChart');
            const ctx = cvs.getContext('2d');
            
            // Logic for High-DPI scrollable chart
            const isMobile = window.innerWidth < 768;
            const dpr = window.devicePixelRatio || 1;
            // Set internal resolution based on CSS width
            const rect = cvs.getBoundingClientRect();
            cvs.width = rect.width * dpr;
            cvs.height = rect.height * dpr;
            ctx.scale(dpr, dpr);
            
            const w = rect.width;
            const h = rect.height;
            ctx.clearRect(0,0,w,h);

            if (!logs.length) {
                ctx.fillStyle = '#888'; ctx.textAlign = 'center'; 
                ctx.fillText("No data yet", w/2, h/2); return;
            }

            const counts = {};
            logs.forEach(l => counts[l.category] = (counts[l.category]||0)+1);
            const cats = Object.keys(counts);
            const max = Math.max(...Object.values(counts));

            const pad = 40;
            const barW = Math.min(60, (w - pad*2) / cats.length - 10);
            const isDark = document.body.classList.contains('dark-mode');

            cats.forEach((cat, i) => {
                const val = counts[cat];
                const barH = (val / max) * (h - pad*2);
                const x = pad + i * ((w-pad*2)/cats.length) + 10;
                const y = h - pad - barH;

                ctx.fillStyle = isDark ? wheelData[cat].darkColor : wheelData[cat].color;
                ctx.fillRect(x, y, barW, barH);
                
                // Value
                ctx.fillStyle = isDark ? '#fff' : '#333';
                ctx.textAlign = 'center';
                ctx.font = '12px sans-serif';
                ctx.fillText(val, x + barW/2, y - 5);
                
                // Label
                ctx.fillText(cat, x + barW/2, h - pad + 15);
            });
            
            // Axis
            ctx.strokeStyle = isDark ? '#555' : '#ccc';
            ctx.beginPath(); ctx.moveTo(pad, pad); ctx.lineTo(pad, h-pad); ctx.lineTo(w-pad, h-pad); ctx.stroke();
        }

        function drawLineChart(logs) {
            const cvs = document.getElementById('lineChart');
            const ctx = cvs.getContext('2d');
            const isMobile = window.innerWidth < 768;
            const dpr = window.devicePixelRatio || 1;
            const rect = cvs.getBoundingClientRect();
            cvs.width = rect.width * dpr;
            cvs.height = rect.height * dpr;
            ctx.scale(dpr, dpr);
            
            const w = rect.width;
            const h = rect.height;
            const pad = 40;
            
            ctx.clearRect(0,0,w,h);
            const isDark = document.body.classList.contains('dark-mode');
            
            // Axis
            ctx.strokeStyle = isDark ? '#555' : '#ccc';
            ctx.beginPath(); ctx.moveTo(pad, pad); ctx.lineTo(pad, h-pad); ctx.lineTo(w-pad, h-pad); ctx.stroke();

            // X-Axis Labels (Time)
            ctx.fillStyle = isDark ? '#888' : '#666';
            ctx.textAlign = 'center';
            for(let i=0; i<=24; i++) {
                // Mobile: skip every 3 hours. Desktop: every 1 hour
                if (isMobile && i % 3 !== 0) continue; 
                
                const x = pad + (i/24) * (w - pad*2);
                ctx.fillText(i, x, h - pad + 15);
            }

            if (!logs.length) return;

            // Group by hour
            const sorted = [...logs].sort((a,b) => a.timestamp - b.timestamp);
            const categories = [...new Set(logs.map(l => l.category))];

            categories.forEach(cat => {
                ctx.strokeStyle = isDark ? wheelData[cat].darkColor : wheelData[cat].color;
                ctx.lineWidth = 2;
                ctx.beginPath();
                
                let first = true;
                // Bucket into hours
                for(let hr=0; hr<=24; hr++) {
                    const count = logs.filter(l => l.category === cat && new Date(l.timestamp).getHours() === hr).length;
                    
                    const x = pad + (hr/24) * (w - pad*2);
                    // Normalize Y (assuming max 5 per hour for scale, or dynamic)
                    const y = h - pad - (count * 15); // Simple scale
                    
                    if (first) { ctx.moveTo(x, y); first = false; }
                    else { ctx.lineTo(x, y); }
                    
                    if (count > 0) {
                        // Draw dot
                        ctx.fillStyle = ctx.strokeStyle;
                        const r = 3;
                        ctx.fillRect(x-r, y-r, r*2, r*2);
                    }
                }
                ctx.stroke();
            });
        }

        // --- Utils ---
        function getTotalEmotionCount() {
            let t = 0;
            for(let k in wheelData) t += Math.max(wheelData[k].middleLayer.length, wheelData[k].outerLayer.length);
            return t;
        }

        function toggleDarkMode() {
            document.body.classList.toggle('dark-mode');
            const isDark = document.body.classList.contains('dark-mode');
            localStorage.setItem('darkMode', isDark ? 'enabled' : 'disabled');
            drawWheel(); // Redraw wheel colors
            updateStats(); // Redraw chart colors
        }

        function checkSystemDarkMode() {
            // Check local storage first
            const local = localStorage.getItem('darkMode');
            if (local === 'enabled') {
                document.body.classList.add('dark-mode');
            } else if (local === 'disabled') {
                document.body.classList.remove('dark-mode');
            } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
                // Fallback to system
                document.body.classList.add('dark-mode');
            }
        }

        function deleteLog(id) {
            emotionLogs = emotionLogs.filter(l => l.id !== id);
            localStorage.setItem('emotionLogs', JSON.stringify(emotionLogs));
            updateStats();
        }

        function clearTodayLogs() {
            const today = new Date().toISOString().split('T')[0];
            if(confirm('Clear today?')) {
                emotionLogs = emotionLogs.filter(l => l.date !== today);
                localStorage.setItem('emotionLogs', JSON.stringify(emotionLogs));
                updateStats();
            }
        }
        
        function downloadData(type) {
            const today = new Date().toISOString().split('T')[0];
            const data = type === 'day' ? emotionLogs.filter(l => l.date === today) : emotionLogs;
            const blob = new Blob([JSON.stringify(data, null, 2)], {type:'application/json'});
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url; a.download = 'emotions.json';
            a.click();
        }

        // Handle resize
        window.onresize = () => { updateStats(); };
        
        init();
    </script>
</body>
</html>
